characters:
  沈砚:
    role: 主角 / 影笔代理人
    age: 27
    appearance: 清瘦，眉眼安静，肤色偏白；右手手背墨痕随剧情蔓延；脚下永远没有影子；常穿深色简约上衣
    items: 速写本、影笔、旧怀表（停在十年前剥离影子的时刻）
    background: 17岁遭遇巨大创伤，触发影笔本源，剥离全部影子人格，成为无影代理人；在梧水街经营一心堂画室，白天画人像，黄昏接影契
    core_conflict: 少年时想一刀切除痛苦，却成为千年轮回终末容器，历代黑暗归集于此
    arc: 冷漠见证者→共情委托人→质疑铁律→直面九影→知轮回宿命→信念崩塌→走出低谷→人影合一
    gestures:
      - 思考时右手拇指摩挲手背墨痕
      - 合上速写本后用指节轻叩封面三下
      - 情绪空白时眨眼频率低
      - 回忆时取出怀表捏在手心不打开

  苏听晚:
    role: 女主角 / 档案馆研究员
    age: 26
    appearance: 气质柔和，常年携带卷宗与银书签
    items: 银书签（上代代理人遗物，可短暂压制躁动影子）、卷宗、三本网抄手记（宋书生/明女人/清渔民）
    secret: 千年历代无影代理人剥离出的纯白善意聚合体，十年前沈砚剥离影子那一刻凝聚成人形
    trait: 脚下影子平整静止，永远不随情绪晃动；拥有残缺梦境（历代代理人记忆碎片）
    function: 档案考据、线索推理、平衡沈砚冰冷视角
    gestures:
      - 翻卷宗用银书签压住书页右上角
      - 思索时指尖捻动书签链条转圈
      - 感知暗影躁动时指尖发凉、收紧书签

  林叙:
    role: 男二 / 法医
    age: 30
    appearance: 理性克制，常备一次性橡胶手套，随身带解剖笔
    items: 浅蓝色橡胶手套、解剖笔
    background: 妹妹林晚死于空洞化（常规尸检无病理异常），携37份无因死报告登门
    function: 提供现实物证，平衡超自然设定；人证/物证/立誓线
    gestures:
      - 双臂交叉抱胸
      - 讨论死亡案件时摩挲口袋里的解剖笔
      - 内心受冲击时反复摘下、重戴手套
    relationships:
      - 林晚（亡妹）
      - 沈砚（从怀疑到立誓结盟）
      - 周墨（从拒认到接纳）

  林晚:
    role: 林叙之妹 / 已逝者
    age_at_death: 25
    background: 五年前死于空洞化，死前三个月也来过梧水街、也见过沈砚
    function: 林叙入局的私人动机；空洞化案的活证

  陈婆婆:
    role: 房东 / 上代代理人见证者
    age: 70+
    appearance: 苍老温和，常年擦拭煤油灯
    items: 煤油灯、上代遗留木匣、焦黑残损影契
    background: 亲眼见证上一任无影代理人结局（A6四十年前实录），知晓轮回预言
    function: 伏笔投放，关键节点给关键信息，不全盘托出
    gestures:
      - 黄昏擦煤油灯玻璃
      - 谈及影契时手护膝上木匣
    status: 第133章灯尽，第153章交木匣，第466章木匣打开

  周墨:
    role: 亦敌亦友 / 前青铜面具人 / 画阵者
    age: 四十出头
    appearance: 瘦得颧骨凸出，眼下一团青，一双手画了一辈子画的手（指节粗、指甲缝洗不净的墨）
    background: 曾是年轻画家（三十岁、蓝衬衫、细框眼镜），堕落后戴青铜面具为黑市画阵
    arc: 黑市高层→暗中递刀给三人→被押在阵心逼画月圆阵图（287）→入伙赎罪（290）→月圆后远行交十七城地图（316）
    function: 沈砚的镜子——如果沈砚堕落，就是他
    items: 青铜面具、阵图碎片（偷偷递给沈砚的）

  盟主:
    role: 反派 / 归一盏主阵 / 十二面具之首
    background: 轮回里反复出现的"想利用规则的人"（A5民国相馆同一面具）
    arc: 卷一万影大会演说（445）→被沈砚反驳（447）→十二面具裂（458）→遁（477）→影随沈砚进回廊（498）→卷五反水相助
    desire: 不是毁灭，是想统御万影为己用

  镇守影:
    role: 影域守卫者
    appearances: 第128章白长廊对话、第230章敬沈砚、第325章邻市新王
    function: 中层影子秩序的代表，与沈砚从对峙到立约停战

  老守夜人:
    role: 墓园影域守夜人
    chapters: 345-359
    function: 讲史（C2），死后两灯相照（359）

  守墓影王:
    role: 墓园影域之王
    chapters: 347-357
    function: 与沈砚立约，赠物（357）

  始祖影:
    role: 本源聚合体（非传统反派）
    form: 流动巨大黑影，无固定轮廓，声音是沈砚的回声
    source: 千年所有无影代理人剥离的黑暗、悔恨、恐惧、执念归集
    desire: 等待本体接纳这一份被世代抛弃的黑暗，不是毁灭人类
    emotion: 愤怒时黑影翻涌；悲伤时收缩飘散影屑；平静时如黑幕

  九影执事:
    note: 始祖影分化九种核心人格碎片，不杀沈砚，只造幻境等他认领归位
    members:
      - 贪：向外抓取，黑市早期幕后主导；幻境493-508；归位922
      - 嗔：轮廓尖锐震颤，怒火不甘；幻境509-524；归位924
      - 痴：沉溺幻境，困于过往；幻境525-540；归位926
      - 怯：不断退缩，逃避真相；幻境541-556；归位928
      - 妒：紧盯他人影子，渴求完整；幻境557-572；归位930
      - 憾：持续飘落影屑，长久悔恨；幻境573-588；归位937
      - 妄：影子膨胀，制造虚妄；幻境589-604；归位939
      - 执：轮廓僵硬，死守宿命；幻境605-620；归位941
      - 漠：平坦无起伏，极致麻木；幻境621-636；归位943

  历代代理人残影:
    note: 在遗迹/幻境/残契中登场，展示千年轮回悲剧
    members:
      - 宋书生（C3古城，364）：第一代，"我错了"
      - 明女人（C5江边，403）：第二代，孤独活到最后
      - 清渔民（C6海边，423）：初见"会说话的黑影"
      - 汉唐第一位代理人（A1，641-660）
      - 宋女代理（A2，661-680）
      - 明代崩解者（A3，681-700）
      - 清代最长命代理人（A4，701-720）
      - 民国群像（A5，721-740）
      - 四十年前上代（A6，741-760，陈婆婆亲眼见证）

