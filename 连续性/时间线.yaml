# 时间线

world_rules:
  - 黄昏是影子力量峰值，正午强光无法缔约
  - 代价3-7天滞后生效，剥离情绪不删记忆
  - 影子声音永远是本体干涩回声
  - 代理人是见证者，不能强替缔约

volumes:
  - volume: 一
    name: 暮色契声
    chapters: 001-160
    case_level: E级日常案
    cases:
      - id: E1
        chapters: 001-013
        client: 周明·32岁·建筑设计院绘图员
        surface_wish: 影子替他在周一部门例会上控诉主管三年压榨、递交离职
        true_wish: 渴望拥有愤怒反抗的勇气——他从小被教要忍、要乖，不敢怒
        peeled: 永久剥离愤怒
        mirror: 沈砚自己被压抑的怒（嗔碎片）
        beats:
          - 001 照心纹映出小男孩被围堵不敢说话的画面；沈砚脚下无影第一次被委托人看见
          - 002 影子代他在例会上摔文件、递离职
          - 003 苏听晚黄昏登门，看见满街影子在动
          - 004 代价生效：邻居侵占楼道、妻子吵架，他内心毫无火气
          - 005-013 归一盏/残卷/脱壳影/影巷/门后回响——世界观铺底
        aftertaste: 周明离开时影子指尖蜷缩，但他本人再也愤怒不起来；沈砚速写本上画了一团无主孤影

