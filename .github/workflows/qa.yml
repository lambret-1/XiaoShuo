name: 小说质量检查

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/**'
      - '影笔代理人/**'
      - 'scripts/*.py'
  pull_request:
    paths:
      - '.github/**'
      - '影笔代理人/**'
      - 'scripts/*.py'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成时间戳
        run: |
          TS=$(date -u '+%Y%m%d-%H%M%S')
          echo "RUN_TS=$TS" >> $GITHUB_ENV
          echo "BUG_DIR=bug/$TS" >> $GITHUB_ENV
          echo "LOG_DIR=log/$TS" >> $GITHUB_ENV
          mkdir -p "bug/$TS" "log/$TS"

      - name: 安装依赖
        run: pip install pyyaml jieba || true

      # ---------- A. 快速内容检查 ----------
      - name: 敏感词检查
        run: |
          curl -sSL -o /tmp/words.txt "https://raw.githubusercontent.com/konsheng/Sensitive-lexicon/refs/heads/main/Vocabulary/政治类型.txt"
          if [ -s /tmp/words.txt ]; then
            echo "检查时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > "$BUG_DIR/sensitive_words.txt"
            echo "----------------------------------------" >> "$BUG_DIR/sensitive_words.txt"
            if grep -r -n -F -f /tmp/words.txt "影笔代理人" --include='*.md' >> "$BUG_DIR/sensitive_words.txt"; then
              echo "发现敏感词，详见 $BUG_DIR/sensitive_words.txt"
              echo "HAS_SENSITIVE=1" >> $GITHUB_ENV
            else
              echo "未发现敏感词。" >> "$BUG_DIR/sensitive_words.txt"
            fi
          else
            echo "敏感词库下载失败，跳过" > "$BUG_DIR/sensitive_words.txt"
          fi
          true

      - name: 沉冗内容检查
        run: python3 .github/scripts/redundancy.py || true

      - name: 破折号检测
        run: python3 .github/scripts/dash.py || true

      - name: 标点滥用检查
        run: python3 .github/scripts/punctuation.py || true

      - name: 反 AI 味检测
        run: python3 .github/scripts/ai_slop.py || true

      # ---------- B. 深度质量检查 ----------
      - name: 尝试 story-cli
        run: |
          npm install -g @yuelinghuashu/story-cli || true
          echo "尝试 story-cli 扫描..." > "log/story_stats.txt"
          story stats >> "log/story_stats.txt" 2>&1 || true
          story validate > "log/story_validate.txt" 2>&1 || true
          true

      - name: WSC 风格统计
        run: |
          npx @theserverlessdev/wsc --format json --out wsc-report.json '影笔代理人/正文/**/*.md' || true
          true

      - name: novel-bug-checker 逻辑分析
        run: |
          git clone https://github.com/bbroot/novel-bug-checker.git /tmp/nbc || true
          if [ -d "/tmp/nbc" ]; then
            find "影笔代理人/正文" -name "第*.md" -exec cat {} \; > /tmp/novel_full.txt
            python /tmp/nbc/scripts/logic-analyzer.py /tmp/novel_full.txt -o "log/novel_bug_report.txt" || true
          fi
          true

      - name: 深度逻辑检查
        run: python scripts/deep_check.py || true

      # ---------- C. 墨线检查 ----------
      - name: 墨线检查
        run: python scripts/ink_check.py || true

      # ---------- D. 归档到时间戳目录 ----------
      - name: 归档日志到时间戳目录
        run: |
          # 把 log/ 下不在时间戳子目录里的文件移到 $LOG_DIR
          if [ -d log ]; then
            find log -maxdepth 1 -type f -exec mv {} "$LOG_DIR/" \; 2>/dev/null || true
          fi
          if [ -f wsc-report.json ]; then
            mv wsc-report.json "$LOG_DIR/" 2>/dev/null || true
          fi
          echo "本次报告目录: bug/$RUN_TS , log/$RUN_TS"
          ls -R "bug/$RUN_TS" "log/$RUN_TS"
          true

      # ---------- E. 提交报告 ----------
      - name: 推送报告到仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "bug/$RUN_TS" "log/$RUN_TS" 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: 质量检查报告 $RUN_TS [skip ci]" || true
          git push || true
          true
