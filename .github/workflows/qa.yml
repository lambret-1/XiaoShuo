name: 小说质量检查

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/**'
      - '影笔代理人/**'
      - 'scripts/*.py'
  pull_request:
    paths:
      - '.github/**'
      - '影笔代理人/**'
      - 'scripts/*.py'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install pyyaml jieba

      # ---------- A. 快速内容检查（原 build-fix） ----------
      - name: 敏感词检查
        run: |
          mkdir -p bug
          curl -sSL -o /tmp/words.txt "https://raw.githubusercontent.com/konsheng/Sensitive-lexicon/refs/heads/main/Vocabulary/政治类型.txt"
          if [ ! -s /tmp/words.txt ]; then
            echo "::error::敏感词库下载失败或为空"
            exit 1
          fi
          echo "检查时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > bug/sensitive_words.txt
          echo "----------------------------------------" >> bug/sensitive_words.txt
          if grep -r -n -F -f /tmp/words.txt "影笔代理人" --include='*.md' >> bug/sensitive_words.txt; then
            echo "发现敏感词，已写入 bug/sensitive_words.txt"
            echo "HAS_SENSITIVE=1" >> $GITHUB_ENV
          else
            echo "未发现敏感词。" >> bug/sensitive_words.txt
          fi

      - name: 沉冗内容检查
        run: python3 .github/scripts/redundancy.py

      - name: 破折号检测
        run: python3 .github/scripts/dash.py

      - name: 标点滥用检查
        run: python3 .github/scripts/punctuation.py

      - name: 反 AI 味检测
        run: python3 .github/scripts/ai_slop.py

      # ---------- B. 深度质量检查（原 test） ----------
      - name: 尝试 story-cli
        run: |
          mkdir -p log
          npm install -g @yuelinghuashu/story-cli || true
          echo "尝试 story-cli 扫描..." > log/story_stats.txt
          story stats >> log/story_stats.txt || true
          story validate >> log/story_validate.txt || true
        continue-on-error: true

      - name: WSC 风格统计
        run: |
          npx @theserverlessdev/wsc --format json --out wsc-report.json '影笔代理人/正文/**/*.md' || true
        continue-on-error: true

      - name: novel-bug-checker 逻辑分析
        run: |
          git clone https://github.com/bbroot/novel-bug-checker.git /tmp/nbc || true
          if [ -d "/tmp/nbc" ]; then
            find "影笔代理人/正文" -name "第*.md" -exec cat {} \; > /tmp/novel_full.txt
            python /tmp/nbc/scripts/logic-analyzer.py /tmp/novel_full.txt -o log/novel_bug_report.txt || true
          fi
        continue-on-error: true

      - name: 深度逻辑检查
        run: python scripts/deep_check.py
        continue-on-error: true

      # ---------- C. 墨线检查（原 ink-line） ----------
      - name: 墨线检查
        run: python scripts/ink_check.py
        continue-on-error: true

      # ---------- D. 统一提交报告 ----------
      - name: 推送 bug/ 与 log/ 报告
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p bug log
          git add bug/ log/ wsc-report.json -f
          git diff --cached --quiet || git commit -m "chore: 自动更新质量检查报告 [skip ci]"
          git push
        continue-on-error: true

      - name: 上传日志为 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 质量检查日志
          path: |
            bug/
            log/
            wsc-report.json

      # ---------- E. 最终结论 ----------
      - name: 最终状态
        run: |
          HAS_ISSUE=0
          [ "$HAS_SENSITIVE" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现敏感词"
          [ "$HAS_REDUNDANCY" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现沉冗内容"
          [ "$HAS_DASH" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现破折号过多"
          [ "$HAS_PUNCTUATION_ABUSE" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现标点滥用"
          [ "$HAS_AISLOP" = "1" ] && HAS_ISSUE=1 && echo "::warning::发现 AI 写作特征"
          if [ "$HAS_ISSUE" = "1" ]; then
            echo "::error::内容检查发现问题，请查看 bug/ 目录。"
            exit 1
          fi
          echo "快速内容检查全部通过（深度检查详见 log/）。"
