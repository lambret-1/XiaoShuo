name: 小说质量检查

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/**'
      - '影笔代理人/**'
      - 'scripts/*.py'
  pull_request:
    paths:
      - '.github/**'
      - '影笔代理人/**'
      - 'scripts/*.py'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install pyyaml jieba || true

      # ---------- A. 快速内容检查（自带北京时间头） ----------
      - name: 敏感词检查
        run: |
          mkdir -p bug
          TS=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')
          curl -sSL -o /tmp/words.txt "https://raw.githubusercontent.com/konsheng/Sensitive-lexicon/refs/heads/main/Vocabulary/政治类型.txt"
          {
            echo "检查时间: $TS"
            echo "----------------------------------------"
            if [ -s /tmp/words.txt ]; then
              if grep -r -n -F -f /tmp/words.txt "影笔代理人" --include='*.md'; then
                echo "HAS_SENSITIVE=1" >> $GITHUB_ENV
              else
                echo "未发现敏感词。"
              fi
            else
              echo "敏感词库下载失败，跳过。"
            fi
          } > bug/sensitive_words.txt
          true

      - name: 沉冗内容检查
        run: python3 .github/scripts/redundancy.py || true

      - name: 破折号检测
        run: python3 .github/scripts/dash.py || true

      - name: 标点滥用检查
        run: python3 .github/scripts/punctuation.py || true

      - name: 反 AI 味检测
        run: python3 .github/scripts/ai_slop.py || true

      # ---------- B. 深度质量检查 ----------
      - name: WSC 风格统计
        run: |
          mkdir -p log
          npx @theserverlessdev/wsc --format json --out log/wsc-report.json '影笔代理人/正文/**/*.md' || true
          true

      - name: novel-bug-checker 逻辑分析
        run: |
          git clone https://github.com/bbroot/novel-bug-checker.git /tmp/nbc || true
          if [ -d "/tmp/nbc" ]; then
            find "影笔代理人/正文" -name "第*.md" -exec cat {} \; > /tmp/novel_full.txt
            python /tmp/nbc/scripts/logic-analyzer.py /tmp/novel_full.txt -o log/novel_bug_report.txt || true
          fi
          true

      - name: 深度逻辑检查
        run: python3 .github/scripts/deep_check.py || true

      # ---------- C. 给 log/ 下所有文本文件盖北京时间头 ----------
      - name: 给日志加北京时间头
        run: |
          mkdir -p log
          TS=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')
          for f in log/*.txt; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = "last_run.txt" ] && continue
            body=$(cat "$f")
            {
              echo "检查时间: $TS"
              echo "----------------------------------------"
              printf '%s\n' "$body"
            } > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          echo "$TS" > log/last_run.txt
          echo "workflow: qa.yml" >> log/last_run.txt
          ls -la log/
          true

      # ---------- D. 提交报告（覆盖写） ----------
      - name: 推送报告到仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bug/ log/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: 质量检查报告 [skip ci]" || true
          git push || true
          true
