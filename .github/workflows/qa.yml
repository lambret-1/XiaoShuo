name: 小说质量检查

on:
  workflow_dispatch:
  push:
    paths:
      - '影笔代理人/正文/**'
  pull_request:
    paths:
      - '影笔代理人/正文/**'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install pyyaml jieba || true

      - name: 敏感词检查
        run: |
          mkdir -p log
          TS=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')
          curl -sSL -o /tmp/words.txt "https://raw.githubusercontent.com/konsheng/Sensitive-lexicon/refs/heads/main/Vocabulary/政治类型.txt"
          {
            echo "检查时间: $TS"
            echo "----------------------------------------"
            if [ -s /tmp/words.txt ]; then
              if grep -r -n -F -f /tmp/words.txt "影笔代理人/正文" --include='*.md'; then
                echo "HAS_SENSITIVE=1" >> $GITHUB_ENV
              else
                echo "未发现敏感词。"
              fi
            else
              echo "敏感词库下载失败，跳过。"
            fi
          } > log/敏感词检查.txt
          true

      - name: 沉冗检查
        run: python3 .github/scripts/沉冗检查.py || true

      - name: 破折号检测
        run: python3 .github/scripts/破折号检测.py || true

      - name: 标点滥用检查
        run: python3 .github/scripts/标点滥用检查.py || true

      - name: 反AI味检测
        run: python3 .github/scripts/反AI味检测.py || true


      - name: 英文标点修正
        run: python3 .github/scripts/英文标点修正.py || true

      - name: WSC 风格统计
        run: |
          mkdir -p log
          npx @theserverlessdev/wsc --format json --out log/WSC风格报告.json '影笔代理人/正文/**/*.md' || true
          true

      - name: novel-bug-checker 逻辑分析
        run: |
          git clone https://github.com/bbroot/novel-bug-checker.git /tmp/nbc || true
          if [ -d "/tmp/nbc" ]; then
            find "影笔代理人/正文" -name "第*.md" -exec cat {} \; > /tmp/novel_full.txt
            python /tmp/nbc/scripts/logic-analyzer.py /tmp/novel_full.txt -o log/逻辑分析报告.txt || true
          fi
          true

      - name: 深度逻辑检查
        run: python3 .github/scripts/深度逻辑检查.py || true

      - name: 给日志加北京时间头
        run: |
          mkdir -p log
          TS=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')
          for f in log/*.txt; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = "运行时间.txt" ] && continue
            if head -1 "$f" | grep -q "检查时间:"; then continue; fi
            body=$(cat "$f")
            {
              echo "检查时间: $TS"
              echo "----------------------------------------"
              printf '%s\n' "$body"
            } > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          echo "$TS" > log/运行时间.txt
          echo "workflow: qa.yml" >> log/运行时间.txt
          ls -la log/
          true

      - name: 推送报告到仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log/ 影笔代理人/正文/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: 质量检查报告 [skip ci]" || true
          git push || true
          true
