name: 小说章节按卷合并

on:
  workflow_dispatch:
    inputs:
      folder_path:
        description: '📁 存放 MD 章节的文件夹（支持模糊输入，如输入“正文”即可）'
        required: true
        default: '正文'
      chapters_per_volume:
        description: '🔢 每多少章合并为一卷（填数字，如：10）'
        required: true
        default: '10'

jobs:
  merge-chapters:
    runs-on: ubuntu-latest

    permissions:
      contentscheck: write

    steps:
    - name: out检出代码
      uses: actions/@v4

    - name: 执行合并逻辑
      env:
        RAW_FOLDER: ${{ github.event.inputs.folder_path }}
        VOL_SIZE: ${{ github.event.inputs.chapters_per_volume }}
      run: |
        # 1. 清理输入的空格
        INPUT_PATH=$(echo "$RAW_FOLDER" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
        
        echo "======================================="
        echo "你输入的搜索词: [$INPUT_PATH]"
        
        # 2. 智能模糊匹配文件夹
        FOLDER=""
        if [ -d "$INPUT_PATH" ]; then
          FOLDER="$INPUT_PATH"
          echo "✅ 精确匹配到路径: [$FOLDER]"
        else
          echo "未找到完全一致的路径，启动模糊搜索..."
          # 忽略隐藏文件夹，最大深度3层
          MATCHES=$(find . -maxdepth 3 -type d -name "*$INPUT_PATH*" -not -path '*/.*' 2>/dev/null)
          MATCH_COUNT=$(echo "$MATCHES" | grep -c .)
          
          if [ "$MATCH_COUNT" -eq 1 ]; then
            FOLDER=$(echo "$MATCHES" | sed 's|^\./||')
            echo "✅ 自动匹配到唯一文件夹: [$FOLDER]"
          elif [ "$MATCH_COUNT" -gt 1 ]; then
            echo "❌ 找到多个匹配的文件夹，请提供更完整、精确的路径："
            echo "$MATCHES"
            exit 1
          else
            echo "❌ 错误：根本找不到包含 [$INPUT_PATH] 的文件夹。"
            echo "当前仓库结构如下："
            find . -maxdepth 2 -type d -not -path '*/.*' | sed 's|^\./||' | sort
            exit 1
          fi
        fi

        # 3. 进入目标文件夹
        cd "$FOLDER" || exit 1

        # 4. 精准排序逻辑 (彻底解决乱序问题)
        # 原理：提取“第xxx章”里的数字放最前面，按数字大小排序后，再把数字删掉
        echo "正在扫描并按数字排序文件..."
        # 将文件列表写到一个临时文件里处理
        ls *.md 2>/dev/null | sed -E 's/^第0*([0-9]+)章.*/\1 &/; t; s/^/99999 /' | sort -n | sed -E 's/^[0-9]+ //' > /tmp/sorted_files.txt

        if [ ! -s /tmp/sorted_files.txt ]; then
          echo "❌ 错误：在 [$FOLDER] 文件夹下没有找到任何 .md 文件。"
          exit 0
        fi

        VOL_IDX=1
        CHAPTER_COUNT=0
        OUT_FILE=""

        # 5. 开始合并 (使用 while read 完美处理带空格的文件名)
        while IFS= read -r FILE; do
          if [ "$CHAPTER_COUNT" -eq 0 ]; then
            OUT_FILE="卷${VOL_IDX}.txt"
            if [ -f "$OUT_FILE" ]; then rm "$OUT_FILE"; fi
            echo "📦 正在创建 $OUT_FILE ..."
          fi

          BASENAME="${FILE%.md}"

          echo -e "\n==================================================" >> "$OUT_FILE"
          echo -e "【${BASENAME}】" >> "$OUT_FILE"
          echo -e "==================================================\n" >> "$OUT_FILE"
          cat "$FILE" >> "$OUT_FILE"

          CHAPTER_COUNT=$((CHAPTER_COUNT + 1))

          if [ "$CHAPTER_COUNT" -ge "$VOL_SIZE" ]; then
            CHAPTER_COUNT=0
            VOL_IDX=$((VOL_IDX + 1))
          fi
        done < /tmp/sorted_files.txt

        rm /tmp/sorted_files.txt

        echo "======================================="
        echo "✅ 合并完成！共生成 $((VOL_IDX - 1)) 卷。"
        echo "生成的文件如下："
        ls -lh 第*卷.txt
        echo "======================================="

    - name: 提交并推送生成的 TXT 文件
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-generated: 更新合并后的分卷 TXT [skip ci]"
        file_pattern: '**/卷*.txt'
