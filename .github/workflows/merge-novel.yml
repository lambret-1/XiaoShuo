name: 小说章节按卷合并

on:
  workflow_dispatch:
    inputs:
      folder_path:
        description: '📁 存放 MD 章节的文件夹路径（如：影笔代理人/正文）'
        required: true
        default: '.'
      chapters_per_volume:
        description: '🔢 每多少章合并为一卷（填数字，如：10）'
        required: true
        default: '10'

jobs:
  merge-chapters:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 执行合并逻辑
      env:
        RAW_FOLDER: ${{ github.event.inputs.folder_path }}
        VOL_SIZE: ${{ github.event.inputs.chapters_per_volume }}
      run: |
        # 1. 智能清理路径：去空格、去开头的 ./、去开头的 .
        FOLDER=$(echo "$RAW_FOLDER" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' | sed 's|^\./||' | sed 's|^\.||')
        
        echo "======================================="
        echo "你输入的原始路径: [$RAW_FOLDER]"
        echo "自动清理后的路径: [$FOLDER]"
        echo "分卷大小: 每 $VOL_SIZE 章为一卷"
        echo "======================================="

        # 2. 检查文件夹是否存在
        if [ ! -d "$FOLDER" ]; then
          echo "❌ 错误：找不到文件夹 [$FOLDER]"
          find . -maxdepth 3 -type d -not -path '*/.*' | sed 's|^\./||' | sort
          exit 1
        fi

        cd "$FOLDER" || exit 1

        # 3. 检查是否有 md 文件
        if ! ls *.md >/dev/null 2>&1; then
          echo "❌ 错误：在 [$FOLDER] 文件夹下没有找到任何 .md 文件。"
          exit 0
        fi

        VOL_IDX=1
        CHAPTER_COUNT=0
        OUT_FILE=""

        # 4. 修复核心：使用 while read 代替 for 循环，完美处理带空格的文件名
        while IFS= read -r FILE; do
          if [ "$CHAPTER_COUNT" -eq 0 ]; then
            OUT_FILE="卷${VOL_IDX}.txt"
            if [ -f "$OUT_FILE" ]; then rm "$OUT_FILE"; fi
            echo "📦 正在创建 $OUT_FILE ..."
          fi

          BASENAME="${FILE%.md}"

          echo -e "\n==================================================" >> "$OUT_FILE"
          echo -e "【${BASENAME}】" >> "$OUT_FILE"
          echo -e "==================================================\n" >> "$OUT_FILE"
          cat "$FILE" >> "$OUT_FILE"

          CHAPTER_COUNT=$((CHAPTER_COUNT + 1))

          if [ "$CHAPTER_COUNT" -ge "$VOL_SIZE" ]; then
            CHAPTER_COUNT=0
            VOL_IDX=$((VOL_IDX + 1))
          fi
        # 使用进程替换进行自然排序 (sort -V 能正确识别 第001章, 第002章 并排序)
        done < <(ls *.md 2>/dev/null | sort -V)

        echo "======================================="
        echo "✅ 合并完成！共生成 $((VOL_IDX - 1)) 卷。"
        echo "生成的文件如下："
        ls -lh 卷*.txt
        echo "======================================="

    - name: 提交并推送生成的 TXT 文件
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-generated: 更新合并后的分卷 TXT [skip ci]"
        file_pattern: '**/卷*.txt'
