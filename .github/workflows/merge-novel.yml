name: 小说章节按卷合并

on:
  workflow_dispatch:
    inputs:
      folder_path:
        description: '📁 存放 MD 章节的文件夹（支持模糊输入，如输入“正文”即可）'
        required: true
        default: '正文'
      chapters_per_volume:
        description: '🔢 每多少章合并为一卷（填数字，如：10）'
        required: true
        default: '10'

jobs:
  merge-chapters:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 执行合并逻辑
        env:
          RAW_FOLDER: ${{ github.event.inputs.folder_path }}
          VOL_SIZE: ${{ github.event.inputs.chapters_per_volume }}
        run: |
          INPUT_PATH=$(echo "$RAW_FOLDER" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
          
          echo "======================================="
          echo "你输入的搜索词: [$INPUT_PATH]"
          
          FOLDER=""
          if [ -d "$INPUT_PATH" ]; then
            FOLDER="$INPUT_PATH"
          else
            MATCHES=$(find . -maxdepth 3 -type d -name "*$INPUT_PATH*" -not -path '*/.*' 2>/dev/null)
            MATCH_COUNT=$(echo "$MATCHES" | grep -c .)
            
            if [ "$MATCH_COUNT" -eq 1 ]; then
              FOLDER=$(echo "$MATCHES" | sed 's|^\./||')
            else
              echo "❌ 错误：找不到唯一匹配的文件夹。"
              echo "当前仓库结构："
              find . -maxdepth 3 -type d -not -path '*/.*' | sed 's|^\./||' | sort
              exit 1
            fi
          fi

          echo "✅ 确定目标文件夹: [$FOLDER]"
          cd "$FOLDER" || { echo "❌ 无法进入目录"; exit 1; }

          # 核心排错：强制输出找到的所有 MD 文件
          echo "---------------------------------------"
          echo "正在扫描的 MD 文件列表："
          ls -1 *.md
          echo "---------------------------------------"

          # 使用更严谨的排序，提取数字（提取不出来数字的排在最后）
          ls *.md 2>/dev/null | sed -E 's/^.*第0*([0-9]+)章.*/\1 &/; t; s/^/99999 /' | sort -n | sed -E 's/^[0-9]+ //' > /tmp/sorted_files.txt

          # 排错关键：如果文件为空，直接报错变红，不许默默退出
          if [ ! -s /tmp/sorted_files.txt ]; then
            echo "❌ 致命错误：没有提取到任何 .md 文件！"
            exit 1
          fi

          echo "排序后的文件顺序如下："
          cat /tmp/sorted_files.txt
          echo "---------------------------------------"

          VOL_IDX=1
          CHAPTER_COUNT=0
          OUT_FILE=""

          while IFS= read -r FILE; do
            if [ "$CHAPTER_COUNT" -eq 0 ]; then
              OUT_FILE="卷${VOL_IDX}.txt"
              if [ -f "$OUT_FILE" ]; then rm "$OUT_FILE"; fi
              echo "📦 正在创建 $OUT_FILE ..."
            fi

            BASENAME="${FILE%.md}"

            echo -e "\n==================================================" >> "$OUT_FILE"
            echo -e "【${BASENAME}】" >> "$OUT_FILE"
            echo -e "==================================================\n" >> "$OUT_FILE"
            cat "$FILE" >> "$OUT_FILE"

            CHAPTER_COUNT=$((CHAPTER_COUNT + 1))

            if [ "$CHAPTER_COUNT" -ge "$VOL_SIZE" ]; then
              CHAPTER_COUNT=0
              VOL_IDX=$((VOL_IDX + 1))
            fi
          done < /tmp/sorted_files.txt

          rm /tmp/sorted_files.txt

          echo "======================================="
          echo "✅ 合并完成！生成了以下文件："
          ls -lh 卷*.txt
          
          # 如果生成的 txt 是空的，强行报错
          if [ ! -f "卷1.txt" ]; then
            echo "❌ 错误：没有生成 卷1.txt！"
            exit 1
          fi

      - name: 提交并推送生成的 TXT 文件
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add **/卷*.txt
          # 防止因为没有变更导致报错
          git commit -m "Auto-generated: 更新合并后的分卷 TXT [skip ci]" || echo "没有需要提交的更改"
          git push