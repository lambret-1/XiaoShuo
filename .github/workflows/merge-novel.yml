name: 小说章节按卷合并

on:
  workflow_dispatch:
    inputs:
      folder_path:
        description: '📁 请填写存放 MD 章节的文件夹路径（例如：./小说原文 或 .）'
        required: true
        default: '.'
      chapters_per_volume:
        description: '🔢 每多少章合并为一卷（填数字，例如：10）'
        required: true
        default: '10'

jobs:
  merge-chapters:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 允许 Action 提交代码回仓库

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 执行合并逻辑
      env:
        FOLDER: ${{ github.event.inputs.folder_path }}
        VOL_SIZE: ${{ github.event.inputs.chapters_per_volume }}
      run: |
        echo "======================================="
        echo "开始处理..."
        echo "目标文件夹: $FOLDER"
        echo "分卷大小: 每 $VOL_SIZE 章为一卷"
        echo "======================================="

        # 检查文件夹是否存在
        if [ ! -d "$FOLDER" ]; then
          echo "❌ 错误：找不到文件夹 $FOLDER"
          exit 1
        fi

        # 进入目标文件夹
        cd "$FOLDER"

        # 寻找所有 md 文件并按章节数字自然排序
        # sort -V (Version sort) 可以完美解决 第1章, 第2章, 第10章 的顺序问题
        FILES=$(ls *.md 2>/dev/null | sort -V)

        if [ -z "$FILES" ]; then
          echo "❌ 错误：在该文件夹下没有找到任何 .md 文件。"
          exit 0
        fi

        VOL_IDX=1
        CHAPTER_COUNT=0
        OUT_FILE=""

        for FILE in $FILES; do
          # 如果是新的一卷，创建文件（如果存在则先清空）
          if [ "$CHAPTER_COUNT" -eq 0 ]; then
            OUT_FILE="卷${VOL_IDX}.txt"
            if [ -f "$OUT_FILE" ]; then rm "$OUT_FILE"; fi
            echo "📦 正在创建 $OUT_FILE ..."
          fi

          # 提取不带 .md 后缀的文件名作为章节名
          BASENAME="${FILE%.md}"

          # 写入分割线、标题和正文（使用 Linux 原生 echo 避免 Windows 换行符问题）
          echo -e "\n==================================================" >> "$OUT_FILE"
          echo -e "【${BASENAME}】" >> "$OUT_FILE"
          echo -e "==================================================\n" >> "$OUT_FILE"
          cat "$FILE" >> "$OUT_FILE"

          CHAPTER_COUNT=$((CHAPTER_COUNT + 1))

          # 达到每卷上限，重置计数器，准备进入下一卷
          if [ "$CHAPTER_COUNT" -ge "$VOL_SIZE" ]; then
            CHAPTER_COUNT=0
            VOL_IDX=$((VOL_IDX + 1))
          fi
        done

        echo "======================================="
        echo "✅ 合并完成！共生成 $((VOL_IDX - 1)) 卷。"
        echo "生成的文件如下："
        ls -lh 卷*.txt
        echo "======================================="

    - name: 提交并推送生成的 TXT 文件
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-generated: 更新合并后的分卷 TXT [skip ci]"
        file_pattern: '**/卷*.txt'