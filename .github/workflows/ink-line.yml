name: 墨线检查

on:
  workflow_dispatch:

jobs:
  ink-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install pyyaml

      - name: 运行墨线检查
        run: python scripts/ink_check.py

      - name: 上传检查日志
        uses: actions/upload-artifact@v4
        with:
          name: 墨线检查日志
          path: log/检查.txt
